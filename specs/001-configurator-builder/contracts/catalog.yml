openapi: 3.1.0
info:
  title: Configurator Catalog API (Mock)
  version: 1.0.0
servers:
  - url: https://demo.vivar.local/api
paths:
  /catalog:
    get:
      summary: Fetch mock catalog data for presets, colors, and options
      operationId: getCatalog
      parameters:
        - in: query
          name: productId
          schema:
            type: string
          description: Optional product filter (mock)
      responses:
        '200':
          description: Catalog payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '500':
          description: Unexpected server error
components:
  schemas:
    CatalogResponse:
      type: object
      required:
        - presets
        - options
        - colors
      properties:
        presets:
          type: array
          items:
            $ref: '#/components/schemas/Preset'
        options:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/Color'
    Preset:
      type: object
      required:
        - id
        - name
        - description
        - optionIds
        - colorSwatch
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        optionIds:
          type: array
          items:
            type: string
        colorSwatch:
          type: string
          description: Hex code
        aiScript:
          type: string
          description: Placeholder AI suggestion copy
    Option:
      type: object
      required:
        - id
        - name
        - category
        - priceImpact
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        priceImpact:
          type: number
        description:
          type: string
          nullable: true
    Color:
      type: object
      required:
        - id
        - name
        - swatch
      properties:
        id:
          type: string
        name:
          type: string
        swatch:
          type: string
          description: Hex code
